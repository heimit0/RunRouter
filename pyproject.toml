[project]
name = "runrouter"
version = "0.1.0"
description = "Real-world running route finder on OpenStreetMap (OSRM + Overpass + Nominatim)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.scripts]
runrouter = "runrouter.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runrouter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
