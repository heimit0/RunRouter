[project]
name = "runrouter"
version = "0.1.0"
description = "Real-world running route finder on OpenStreetMap (OSRM + Overpass + Nominatim)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.scripts]
runrouter = "runrouter.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
